# DBSI GUI configuration file
# Companion tool to ArxivPaperR04InsolationExpansion.tex
# Any key omitted falls back to this paper's own default value.

# Earth's mean heliocentric orbital elements (paper Sec. 2 / Appendix E).
[orbital]
eccentricity = 0.0167141
obliquity_deg = 23.44
omega_tilde_deg = 103.1609
perihelion_datetime = 2022-01-03T22:29:33.118110
orbital_period_days = 365.2421748385884

# Observer location. 'name' is a label only -- lat/lon/alt below are what's used.
[location]
name = Golden
latitude_deg = 39.7423
longitude_deg = -105.221
altitude_m = 1730.0

# Study period and sampling resolution (samples_per_day: 24=hourly, 1440=1-minute).
[time]
start_datetime = 2024-01-01T00:00:00
end_datetime = 2025-01-01T00:00:00
samples_per_day = 24

# Solar constant and this paper's own single-extinction-cross-section transmittance model.
[atmosphere]
tsi_wm2 = 1361.0
sigma_ext_m2kg = 0.0025
atm_thickness_km = 100.0
atm_density_kgm3 = 1.22

# Optional Bird & Hulstrom (1981) comparison. include_bird=false skips this model entirely.
[bird]
include_bird = False
tau_a038 = 0.039
tau_a05 = 0.03
ozone_atmcm = 0.35
water_cm = 1.4

